<!DOCTYPE html>

<head>
    <meta charset="UTF-8" />

    <style>
        /* خلفية السحاب الناصعة */
        body {
            background: #eef2f5 url('https://images.unsplash.com/photo-1534088568595-a066f410bcda?q=80&w=1000&auto=format&fit=crop') no-repeat center center fixed !important;
            background-size: cover !important;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            font-family: 'Open Sans', sans-serif;
        }

        /* حاوية تتوسط الشاشة */
        .wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 80px;
            padding-bottom: 20px;
        }

        /* الكارت المودرن بتدرج ناعم ومريح للعين */
        .auth-container {
            width: 420px;
            max-width: 90%;
            background: linear-gradient(180deg, #ffffff 0%, #f4fbf7 60%, #e1f9eb 100%) !important;
            padding: 35px 30px;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.9);
        }

        /* التبويبات العلوية */
        .auth-tabs {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
        }

        .auth-tab-btn {
            background: none;
            border: none;
            padding: 8px 20px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            color: #64748b;
            transition: all 0.3s ease;
            border-radius: 8px;
        }

        .auth-tab-btn.active {
            color: #0f172a;
            background: #34d399;
            box-shadow: 0 4px 12px rgba(52, 211, 153, 0.3);
        }

        /* الحقول والعناوين بألوان واضحة جداً */
        .form-group {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            text-align: right;
        }

        .form-group label {
            margin-bottom: 6px;
            font-weight: 700;
            color: #0f172a; /* لون داكن وواضح لقراءة مريحة */
            font-size: 14px;
        }

        .form-group input {
            padding: 12px 15px;
            border: 1.5px solid #cbd5e1;
            background: #ffffff;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            color: #0f172a;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.03);
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }

        /* رقم الهاتف */
        .phone-input-group {
            display: flex;
            direction: ltr;
        }

        .phone-prefix {
            background: #f1f5f9;
            padding: 12px 14px;
            border: 1.5px solid #cbd5e1;
            border-right: none;
            border-radius: 10px 0 0 10px;
            font-weight: 700;
            color: #0f172a;
        }

        .phone-input-group input {
            border-radius: 0 10px 10px 0;
            flex: 1;
        }

        /* زر الإرسال البنفسجي المودرن */
        .auth-submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: #ffffff;
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 6px 18px rgba(124, 58, 237, 0.35);
            transition: all 0.3s ease;
        }

        .auth-submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(124, 58, 237, 0.5);
        }

        .error-msg {
            color: #ef4444;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

              <rect x="28" y="50" width="8" height="8" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1"/>
              <rect x="64" y="50" width="8" height="8" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1"/>
              <circle cx="50" cy="25" r="3" fill="#FDD835" stroke="#FBC02D" stroke-width="1"/>

          </div>
          <ul class="nav-list">
              <li><a href="index.html">Home</a></li>

    <!-- المربع في نص الشاشة بالضبط -->
    <div class="wrapper">
        <div class="auth-container">
            <div class="auth-tabs">
                <button class="auth-tab-btn active" id="loginTabBtn" onclick="switchTab('login')">تسجيل الدخول</button>
                <button class="auth-tab-btn" id="signupTabBtn" onclick="switchTab('signup')">حساب جديد</button>
            </div>

            <!-- فورم الدخول -->
            <form id="loginForm">
                <div class="form-group">
                    <label>اسم المستخدم / البريد الإلكتروني</label>
                    <input type="text" id="loginUsername" required placeholder="أدخل اسم المستخدم">
                </div>
                <div class="form-group">
                    <label>كلمة السر</label>
                    <input type="password" id="loginPassword" required placeholder="أدخل كلمة السر">
                </div>
                <button type="submit" class="auth-submit-btn">دخول</button>
            </form>

            <!-- فورم حساب جديد -->
            <form id="signupForm" class="hidden">
                <div class="form-group">
                    <label>الاسم الأول</label>
                    <input type="text" id="firstName" required placeholder="مثال: أمير">
                </div>
                <div class="form-group">
                    <label>اسم العائلة</label>
                    <input type="text" id="lastName" required placeholder="مثال: محمد">
                </div>
                <div class="form-group">
                    <label>رقم الهاتف (مصر)</label>
                    <div class="phone-input-group">
                        <span class="phone-prefix">+20</span>
                        <input type="text" id="phone" maxlength="10" required placeholder="10xxxxxxxx">
                    </div>
                    <span class="error-msg" id="phoneError">10 أرقام فقط بعد +20</span>
                </div>
                <div class="form-group">
                    <label>حساب Gmail</label>
                    <input type="email" id="email" required placeholder="example@gmail.com">
                    <span class="error-msg" id="emailError">يجب أن ينتهي بـ @gmail.com</span>
                </div>
                <div class="form-group">
                    <label>كلمة السر</label>
                    <input type="password" id="signupPassword" required placeholder="حروف و ارقام فقط">
                    <span class="error-msg" id="passError">حروف كبيرة وصغيرة وأرقام (8 خانات)</span>
                </div>
                <button type="submit" class="auth-submit-btn">إنشاء الحساب</button>
            </form>
        </div>
    </div>

    <script src="login.js"></script>
    <script src="index.js"></script>
</body>
